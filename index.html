<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Message Sender</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: rgba(148, 163, 184, 0.1);
            --success-color: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        .helper-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: block;
        }

        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.2s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        #results-area {
            margin-top: 2.5rem;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 1rem;
        }

        th {
            text-align: left;
            padding: 1rem;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: rgba(34, 197, 94, 0.1);
            color: var(--success-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .action-link:hover {
            background-color: rgba(34, 197, 94, 0.2);
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>WhatsApp Generator</h1>
            <p class="subtitle">Bulk generate WhatsApp links instantly</p>
        </header>

        <div class="input-group">
            <label for="records">Records</label>
            <span class="helper-text">Format: Name, Phone Number (one per line)</span>
            <textarea id="records" rows="6" placeholder="John Doe, 1234567890&#10;Jane Smith, 9876543210"></textarea>
            <div id="records-error" class="error-msg"></div>
        </div>

        <div class="input-group">
            <label for="message">Message</label>
            <span class="helper-text">Enter your WhatsApp formatted message</span>
            <textarea id="message" rows="4" placeholder="Hello *Name*, check this out!"></textarea>
        </div>

        <button id="generate-btn">Generate Links</button>

        <div id="results-area">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be added here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', function() {
            const recordsInput = document.getElementById('records').value;
            const messageInput = document.getElementById('message').value;
            const errorDiv = document.getElementById('records-error');
            const resultsArea = document.getElementById('results-area');
            const tbody = document.querySelector('#results-table tbody');

            // Reset state
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
            tbody.innerHTML = '';
            resultsArea.style.display = 'none';

            if (!recordsInput.trim()) {
                errorDiv.textContent = 'Please enter at least one record.';
                errorDiv.style.display = 'block';
                return;
            }

            const lines = recordsInput.split('\n');
            let hasValidRecords = false;

            lines.forEach(line => {
                if (!line.trim()) return;

                const parts = line.split(',');
                if (parts.length < 2) {
                    // Skip invalid lines or handle error? For now, let's skip but maybe log
                    console.warn('Skipping invalid line:', line);
                    return;
                }

                const name = parts[0].trim();
                // Basic phone cleaning: remove spaces, dashes, parens
                let phone = parts[1].trim().replace(/[\s\-\(\)]/g, '');
                
                // Ensure phone has no other characters? 
                // For simplicity, we assume the user puts in a valid number format for WhatsApp API
                // WhatsApp API usually expects country code without +, but works with it often too.
                // We'll leave it mostly as is but strip non-digits/plus if needed.
                // Actually, let's just use it as provided after trim, maybe strip non-numeric except +
                phone = phone.replace(/[^0-9+]/g, '');

                if (name && phone) {
                    hasValidRecords = true;
                    const encodedMessage = encodeURIComponent(messageInput);
                    const waLink = `https://wa.me/${phone}?text=${encodedMessage}`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(name)}</td>
                        <td>${escapeHtml(phone)}</td>
                        <td>
                            <a href="${waLink}" target="_blank" class="action-link">
                                Send Message 
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                            </a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                }
            });

            if (hasValidRecords) {
                resultsArea.style.display = 'block';
            } else {
                errorDiv.textContent = 'No valid records found. Please check format: Name, Phone';
                errorDiv.style.display = 'block';
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
